  <path d="M28 96 A 38 38 0 0 1 66 58" fill="none" stroke="url(#wave)" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
  <path d="M28 96 A 20 20 0 0 1 48 76" fill="none" stroke="url(#wave)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="30" cy="94" r="7" fill="#ff8a3d"/>
  <!-- Minimal Sonos speaker silhouette top-right -->
  <rect x="74" y="26" width="28" height="44" rx="8" fill="none" stroke="#f5f6fa" stroke-width="5"/>
  <circle cx="88" cy="40" r="3" fill="#f5f6fa"/>
  <circle cx="88" cy="56" r="7" fill="none" stroke="url(#wave)" stroke-width="4"/>
